<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'IS'; src: url('{{FONT_REGULAR}}'); }
  @font-face { font-family: 'ISI'; src: url('{{FONT_ITALIC}}'); }
  html, body { margin: 0; width: 1290px; height: 2796px; overflow: hidden; background: #090d16; }
  .bg { position: absolute; inset: 0;
    background: radial-gradient(900px 760px at 50% 34%, #232d42 0%, rgba(35,45,66,0) 72%), linear-gradient(180deg, #101828 0%, #090d16 100%); }
  .ring { position: absolute; left: 645px; top: 1500px; border: 2px solid rgba(255,255,255,0.045); border-radius: 50%; transform: translate(-50%, -50%); }
  .dot { position: absolute; left: 645px; top: 150px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #e5a93c; }
  h1 { position: absolute; top: 250px; left: 50%; transform: translateX(-50%); margin: 0; white-space: nowrap;
    font-family: 'IS'; font-weight: 400; font-size: 150px; line-height: 1.05; color: #f5efe6; }
  h1 em { font-family: 'ISI'; font-style: italic; color: #e5a93c; }
  .sub { position: absolute; top: 500px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-family: 'ISI'; font-style: italic; font-size: 56px; color: #a3aab8; }
  .phone { position: absolute; left: 110px; top: 744px; width: 1070px; height: 2200px; box-sizing: border-box;
    border-radius: 130px; border: 3px solid #394558; background: #05070b; overflow: hidden;
    box-shadow: 0 0 120px rgba(0,0,0,0.55), inset 0 0 0 10px #0b0f17; }
  .screen { position: absolute; left: 14px; top: 14px; width: 1038px; height: 2180px; border-radius: 116px; overflow: hidden; }
  .screen img { width: 1038px; display: block; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="ring" style="width:1400px;height:1400px"></div>
  <div class="ring" style="width:2000px;height:2000px"></div>
  <div class="ring" style="width:2600px;height:2600px"></div>
  <div class="dot"></div>
  <h1 id="h">{{PLAIN}} <em>{{ITALIC}}</em></h1>
  <div class="sub" id="s">{{SUB}}</div>
  <div class="phone"><div class="screen"><img src="{{RAW}}"></div></div>
  <script>
    // long headlines shrink until they fit the width with a margin
    function fit(el, max) { var size = parseFloat(getComputedStyle(el).fontSize); while (el.getBoundingClientRect().width > max && size > 40) { size -= 4; el.style.fontSize = size + 'px'; } }
    fit(document.getElementById('h'), 1170);
    fit(document.getElementById('s'), 1100);
  </script>
</body>
</html>
